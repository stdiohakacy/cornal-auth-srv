# Local infrastructure for cornal-auth-srv. Start: `docker compose up -d --wait`.
# Credentials here are for local development only.
name: cornal-auth

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: cornal_auth
      POSTGRES_PASSWORD: cornal_auth
      POSTGRES_DB: cornal_auth
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U cornal_auth -d cornal_auth']
      interval: 2s
      timeout: 3s
      retries: 30

  # Transaction pooling: the app connects here; migrations go straight to postgres.
  pgbouncer:
    image: edoburu/pgbouncer
    environment:
      DB_HOST: postgres
      DB_PORT: '5432'
      DB_USER: cornal_auth
      DB_PASSWORD: cornal_auth
      DB_NAME: cornal_auth
      AUTH_TYPE: scram-sha-256
      POOL_MODE: transaction
      DEFAULT_POOL_SIZE: '20'
      MAX_CLIENT_CONN: '500'
      LISTEN_PORT: '6432'
    ports:
      - '6432:6432'
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', 'nc -z 127.0.0.1 6432']
      interval: 2s
      timeout: 3s
      retries: 30

  redis:
    image: redis:7-alpine
    command: ['redis-server', '--appendonly', 'yes']
    ports:
      - '6379:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 2s
      timeout: 3s
      retries: 30

  nats:
    image: nats:2-alpine
    command: ['-js', '-sd', '/data', '-m', '8222']
    ports:
      - '4222:4222'
      - '8222:8222'
    volumes:
      - nats-data:/data
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1:8222/healthz || exit 1']
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  postgres-data:
  redis-data:
  nats-data:
